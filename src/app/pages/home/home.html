<section class="home">
  <div class="home_hero">
    <div class="home_hero-content">
      <div class="home_eyebrow">
        TopToys
      </div>
      <h1 class="home_title">
        Igra počinje ovde.
      </h1>
      <a mat-raised-button color="primary" routerLink="/toys" class="home_button">
        <span>Pogledaj igračke</span>
        <mat-icon>arrow_forward</mat-icon>
      </a>
    </div>

    <div class="home_decor" aria-hidden="true">
      <span class="home_shape home_shape--one"></span>
      <span class="home_shape home_shape--two"></span>
      <span class="home_shape home_shape--three"></span>
      <div class="home_toy-icon">
        <mat-icon style="font-size: 64px; width: 64px; height: 64px;">toys</mat-icon>
      </div>
    </div>
  </div>

  <section class="home_features" aria-label="Prednosti TopToys prodavnice">
    <mat-card class="home_feature" appearance="outlined">
      <div class="home_feature-icon">
        <mat-icon color="primary">grid_view</mat-icon>
      </div>
      <div>
        <h2>Veliki izbor</h2>
        <p>Mnogo igračaka za različite uzraste.</p>
      </div>
    </mat-card>

    <mat-card class="home_feature" appearance="outlined">
      <div class="home_feature-icon">
        <mat-icon color="primary">search</mat-icon>
      </div>
      <div>
        <h2>Jednostavna pretraga</h2>
        <p>Brzo pronađite ono što tražite.</p>
      </div>
    </mat-card>

    <mat-card class="home_feature" appearance="outlined">
      <div class="home_feature-icon">
        <mat-icon color="primary">card_giftcard</mat-icon>
      </div>
      <div>
        <h2>Jednostavna rezervacija</h2>
        <p>Rezervišite omiljene igračke lako.</p>
      </div>
    </mat-card>
  </section>
</section>
